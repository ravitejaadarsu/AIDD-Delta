name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          npm install -g markdownlint-cli2
      - name: Self-tests
        run: bash tests/run.sh
