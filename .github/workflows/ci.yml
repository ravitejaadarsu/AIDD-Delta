name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI must never silently skip a linter: a missing tool fails the run.
      AIDD_STRICT_LINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install linters (pinned — an unpinned linter broke CI for three releases)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          npm install -g "markdownlint-cli2@$(grep -m1 '^MDLINT_VERSION=' tests/run.sh | cut -d'"' -f2)"
      - name: Assert no linter version drift
        run: |
          want="$(grep -m1 '^MDLINT_VERSION=' tests/run.sh | cut -d'"' -f2)"
          # `--version` prints "markdownlint-cli2 v0.18.1 (markdownlint v0.38.0)" —
          # take the FIRST semver on the line, which is the cli2 version.
          got="$(markdownlint-cli2 --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          echo "tests/run.sh pins ${want}; installed ${got}"
          if [ "${got}" != "${want}" ]; then
            echo "::error::markdownlint drift: pinned ${want}, installed ${got:-none}"
            exit 1
          fi
      - name: Self-tests
        run: bash tests/run.sh

  portable-evidence:
    name: Evidence tools (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise receipts, delivery integration and installed tools
        run: |
          bash tests/evidence.test.sh
          bash tests/readiness.test.sh
          bash tests/product-tools.test.sh
